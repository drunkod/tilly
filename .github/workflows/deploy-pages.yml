name: Deploy to GitHub Pages
#upd
on:
  push:
    branches: [main, 'work/offline-github-pages']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug environment variables
        run: |
          echo "=== Repository Variables Status ==="
          echo "PUBLIC_JAZZ_SYNC_SERVER is set: ${{ vars.PUBLIC_JAZZ_SYNC_SERVER != '' }}"
          echo "PUBLIC_JAZZ_SYNC_SERVER value: ${PUBLIC_JAZZ_SYNC_SERVER:-<not set>}"
          echo "PUBLIC_SERVER_URL is set: ${{ vars.PUBLIC_SERVER_URL != '' }}"
          echo "PUBLIC_SERVER_URL value: ${PUBLIC_SERVER_URL:-<not set>}"
          echo "GITHUB_PAGES_BASE is set: ${{ vars.GITHUB_PAGES_BASE != '' }}"
          echo "GITHUB_PAGES_BASE value: ${GITHUB_PAGES_BASE:-<not set>}"
          echo "=== All Environment Variables ==="
          env | grep -E 'PUBLIC_|GITHUB_' || echo "No PUBLIC_ or GITHUB_ variables found"
        env:
          PUBLIC_JAZZ_SYNC_SERVER: ${{ vars.PUBLIC_JAZZ_SYNC_SERVER }}
          PUBLIC_SERVER_URL: ${{ vars.PUBLIC_SERVER_URL }}
          GITHUB_PAGES_BASE: ${{ vars.GITHUB_PAGES_BASE }}

      - name: Build static site
        run: pnpm build:static
        env:
          PUBLIC_JAZZ_SYNC_SERVER: ${{ vars.PUBLIC_JAZZ_SYNC_SERVER }}
          PUBLIC_SERVER_URL: ${{ vars.PUBLIC_SERVER_URL }}
          GITHUB_PAGES_BASE: ${{ vars.GITHUB_PAGES_BASE }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
