<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... - Tilly</title>
  <script>
    // GitHub Pages SPA fallback
    // This script handles client-side routing for single-page applications on GitHub Pages.
    // When a user navigates directly to a route (e.g., /app/people/123), GitHub Pages
    // serves this 404.html. We redirect to the index with the original path preserved
    // so the client-side router can handle it.
    
    (function() {
      var pathname = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // For /app/* routes, redirect to /app/ and let the SPA router handle it
      // The path is stored in sessionStorage so the app can restore it
      if (pathname.startsWith('/app')) {
        // Store the full path for the SPA to pick up
        sessionStorage.setItem('spa-redirect-path', pathname + search + hash);
        // Redirect to the app entry point
        window.location.replace('/app/');
      } else {
        // For non-app routes, try to detect locale and redirect appropriately
        var lang = navigator.language || navigator.userLanguage || 'en';
        var locale = lang.toLowerCase().startsWith('de') ? 'de' : 'en';
        
        // If it's a locale-specific path that doesn't exist, go to that locale's home
        if (pathname.startsWith('/de/')) {
          window.location.replace('/de/');
        } else if (pathname.startsWith('/en/')) {
          window.location.replace('/en/');
        } else {
          // Default: redirect to detected locale
          window.location.replace('/' + locale + '/');
        }
      }
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #fafafa;
      color: #333;
    }
    .loading {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #e0e0e0; }
      .spinner { border-color: #333; border-top-color: #e0e0e0; }
    }
  </style>
</head>
<body>
  <noscript>
    <meta http-equiv="refresh" content="0;url=/">
  </noscript>
  <div class="loading">
    <div class="spinner"></div>
    <p>Redirecting...</p>
  </div>
</body>
</html>
