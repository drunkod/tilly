<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Redirecting...</title>
		<script>
			// GitHub Pages SPA redirect handler
			// Store the path in sessionStorage and redirect to index.html
			sessionStorage.setItem(
				"spa-redirect-path",
				location.pathname + location.search + location.hash,
			)

			// Find the base path by looking for the segment before '/app'
			const pathSegments = location.pathname.split('/').filter(Boolean);
			const appIndex = pathSegments.indexOf('app');
			const basePath = appIndex > 0 ? '/' + pathSegments.slice(0, appIndex).join('/') : '';

			// Redirect to the base path's index.html
			location.replace(location.origin + basePath + '/');
		</script>
	</head>
	<body></body>
</html>
